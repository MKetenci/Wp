name: Test ve yayın

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Veriyi derle (data/raw → data/, web/data/)
        run: npm run build:data
      - name: Derlenmiş veri depodakiyle aynı mı?
        run: git diff --exit-code -- data web/data
      - run: npm test

  deploy:
    # Only the default branch is published, and only once Pages is set up
    # (Settings → Pages → Source: GitHub Actions) and the repository variable
    # PAGES_ENABLED is set to "true" (Settings → Secrets and variables → Actions → Variables).
    if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
